<!DOCTYPE html>
<html lang="es">
<head>
    <script src="js/utils/authGuard.js"></script>
    <meta charset="UTF-8">
    <title>Pollos - Clientes</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
        <nav class="navbar">
        <button class="btn-hamburguesa" onclick="alternarSidebar()"><i class="fa-solid fa-bars"></i></button>
        <span class="logo">🐔 Pollos App</span>
    </nav>

    <div class="overlay-sidebar" id="overlay-sidebar" onclick="cerrarSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <a href="index.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
        <a href="ventas.html"><i class="fa-solid fa-cart-shopping"></i> Ventas</a>
        <a href="clientes.html"><i class="fa-solid fa-users"></i> Clientes</a>
        <a href="fiados.html"><i class="fa-solid fa-hand-holding-dollar"></i> Fiados</a>
        <a href="quincena.html"><i class="fa-solid fa-calendar-week"></i> Quincena</a>
        <a href="mes.html"><i class="fa-solid fa-calendar-days"></i> Mes</a>

        <div class="sidebar-usuario">
        <i class="fa-solid fa-circle-user"></i>
        <div class="sidebar-usuario-info">
            <span id="sidebar-usuario-nombre">Cargando...</span>
            <a href="#" id="sidebar-cerrar-sesion">Cerrar sesión</a>
        </div>
    </div>
</aside>

    <div class="contenedor" style="max-width:1400px;">
        <div class="layout-ventas">
            <div class="col-formulario">
                <h2><i class="fa-solid fa-user-plus"></i> Registrar cliente</h2>
                <form id="form-cliente">
                    <label><i class="fa-solid fa-user"></i> Nombre</label>
                    <input type="text" id="input-nombre" required>
                    <label><i class="fa-solid fa-phone"></i> Teléfono</label>
                    <input type="text" id="input-telefono">
                    <label><i class="fa-solid fa-envelope"></i> Email</label>
                    <input type="email" id="input-email">
                    <button type="submit" class="btn">Registrar cliente</button>
                </form>
            </div>
            <div class="col-tabla">
                <h3><i class="fa-solid fa-address-book"></i> Listado</h3>
                <div class="tabla-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th><i class="fa-solid fa-user"></i> Nombre</th>
                                <th><i class="fa-solid fa-phone"></i> Teléfono</th>
                                <th><i class="fa-solid fa-envelope"></i> Email</th>
                                <th><i class="fa-solid fa-gear"></i> Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-clientes"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="js/utils/sidebar.js"></script>
    <script src="js/utils/toast.js"></script>
    <script src="js/services/apiClient.js"></script>
    <script src="js/services/clienteService.js"></script>
    <script src="js/pages/clientesPage.js"></script>
</body>
</html>
