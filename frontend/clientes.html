<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pollos - Clientes</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <span class="logo">🐔 Pollos App</span>
        <a href="index.html">Dashboard</a>
        <a href="ventas.html">Ventas</a>
        <a href="clientes.html">Clientes</a>
        <a href="fiados.html">Fiados</a>
        <a href="quincena.html">Quincena</a>
        <a href="mes.html">Mes</a>
    </nav>

    <div class="contenedor" style="max-width:1400px;">
        <div class="layout-ventas">
            <div class="col-formulario">
                <h2><i class="fa-solid fa-user-plus"></i> Registrar cliente</h2>
                <form id="form-cliente">
                    <label><i class="fa-solid fa-user"></i> Nombre</label>
                    <input type="text" id="input-nombre" required>
                    <label><i class="fa-solid fa-phone"></i> Teléfono</label>
                    <input type="text" id="input-telefono">
                    <label><i class="fa-solid fa-envelope"></i> Email</label>
                    <input type="email" id="input-email">
                    <button type="submit" class="btn">Registrar cliente</button>
                </form>
            </div>
            <div class="col-tabla">
                <h3><i class="fa-solid fa-address-book"></i> Listado</h3>
                <div class="tabla-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th><i class="fa-solid fa-user"></i> Nombre</th>
                                <th><i class="fa-solid fa-phone"></i> Teléfono</th>
                                <th><i class="fa-solid fa-envelope"></i> Email</th>
                                <th><i class="fa-solid fa-gear"></i> Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-clientes"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="js/utils/toast.js"></script>
    <script src="js/services/apiClient.js"></script>
    <script src="js/services/clienteService.js"></script>
    <script src="js/pages/clientesPage.js"></script>
</body>
</html>
