<!DOCTYPE html>
<html lang="es">
<head>
    <script src="js/utils/authGuard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pollos - Ventas</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
        <nav class="navbar">
        <button class="btn-hamburguesa" onclick="alternarSidebar()"><i class="fa-solid fa-bars"></i></button>
        <span class="logo">🐔 Pollos App</span>
    </nav>

    <div class="overlay-sidebar" id="overlay-sidebar" onclick="cerrarSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <a href="index.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
        <a href="ventas.html"><i class="fa-solid fa-cart-shopping"></i> Ventas</a>
        <a href="clientes.html"><i class="fa-solid fa-users"></i> Clientes</a>
        <a href="fiados.html"><i class="fa-solid fa-hand-holding-dollar"></i> Fiados</a>
        <a href="quincena.html"><i class="fa-solid fa-calendar-week"></i> Quincena</a>
        <a href="mes.html"><i class="fa-solid fa-calendar-days"></i> Mes</a>

        <div class="sidebar-usuario">
        <i class="fa-solid fa-circle-user"></i>
        <div class="sidebar-usuario-info">
            <span id="sidebar-usuario-nombre">Cargando...</span>
            <a href="#" id="sidebar-cerrar-sesion">Cerrar sesión</a>
        </div>
    </div>
</aside>

    <div class="contenedor" style="max-width:1400px;">
        <div class="layout-ventas">
            <div class="col-formulario">
                <h2><i class="fa-solid fa-plus"></i> Registrar venta</h2>
                <form id="form-venta">
                    <label><i class="fa-solid fa-user"></i> Cliente</label>
                    <select id="select-cliente" required></select>
                    <div class="selector-modo">
                        <label class="opcion-modo">
                            <input type="radio" name="modo-venta" value="libra" checked>
                            <span><i class="fa-solid fa-weight-hanging"></i> Por libra</span>
                        </label>
                        <label class="opcion-modo">
                            <input type="radio" name="modo-venta" value="directo">
                            <span><i class="fa-solid fa-dollar-sign"></i> Precio directo</span>
                        </label>
                    </div>
                    <div id="campos-libra">
                        <label><i class="fa-solid fa-weight-hanging"></i> Peso (lb)</label>
                        <input type="number" id="input-peso" step="0.01" min="0.1">
                        <label><i class="fa-solid fa-tag"></i> Precio por libra</label>
                        <input type="number" id="input-precio" step="0.01" min="0.1">
                    </div>
                    <div id="campos-directo" style="display:none;">
                        <label><i class="fa-solid fa-dollar-sign"></i> Precio total ($)</label>
                        <input type="number" id="input-precio-total" step="0.01" min="0.1" placeholder="Ej: 60000">
                    </div>
                    <label><input type="checkbox" id="input-fiado"> Venta fiada (paga en quincena)</label>
                    <div id="total-preview" style="font-size:20px; font-weight:bold;"></div>
                    <button type="submit" class="btn">Registrar venta</button>
                </form>
            </div>
            <div class="col-tabla">
                <h3><i class="fa-solid fa-list"></i> Ventas recientes</h3>
                <div class="tabla-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th><i class="fa-solid fa-calendar-days"></i> Fecha</th>
                                <th><i class="fa-solid fa-user"></i> Cliente</th>
                                <th><i class="fa-solid fa-weight-hanging"></i> Peso</th>
                                <th><i class="fa-solid fa-tag"></i> Precio/lb</th>
                                <th><i class="fa-solid fa-dollar-sign"></i> Total</th>
                                <th><i class="fa-solid fa-circle-info"></i> Tipo</th>
                                <th><i class="fa-solid fa-gear"></i> Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-ventas"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-editar-overlay" class="modal-overlay" style="display:none;">
        <div class="modal-confirmar" style="max-width:400px; text-align:left;">
            <h3><i class="fa-solid fa-pen"></i> Editar venta</h3>
            <form id="form-editar-venta">
                <label><i class="fa-solid fa-user"></i> Cliente</label>
                <select id="edit-cliente" required></select>
                <label><i class="fa-solid fa-calendar-days"></i> Fecha</label>
                <input type="datetime-local" id="edit-fecha" required>
                <div class="selector-modo">
                    <label class="opcion-modo">
                        <input type="radio" name="edit-modo-venta" value="libra" checked>
                        <span><i class="fa-solid fa-weight-hanging"></i> Por libra</span>
                    </label>
                    <label class="opcion-modo">
                        <input type="radio" name="edit-modo-venta" value="directo">
                        <span><i class="fa-solid fa-dollar-sign"></i> Precio directo</span>
                    </label>
                </div>
                <div id="edit-campos-libra">
                    <label><i class="fa-solid fa-weight-hanging"></i> Peso (lb)</label>
                    <input type="number" id="edit-peso" step="0.01" min="0.1">
                    <label><i class="fa-solid fa-tag"></i> Precio por libra</label>
                    <input type="number" id="edit-precio" step="0.01" min="0.1">
                </div>
                <div id="edit-campos-directo" style="display:none;">
                    <label><i class="fa-solid fa-dollar-sign"></i> Precio total ($)</label>
                    <input type="number" id="edit-precio-total" step="0.01" min="0.1">
                </div>
                <div class="modal-botones" style="margin-top:16px;">
                    <button type="button" class="btn-cancelar" onclick="cerrarModalEditar()">Cancelar</button>
                    <button type="submit" class="btn-confirmar" style="background:#2563eb;">Guardar cambios</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/utils/sidebar.js"></script>
    <script src="js/utils/toast.js"></script>
    <script src="js/services/apiClient.js"></script>
    <script src="js/services/clienteService.js"></script>
    <script src="js/services/ventaService.js"></script>
    <script src="js/pages/ventasPage.js"></script>
</body>
</html>
