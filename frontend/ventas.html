<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pollos - Registrar Venta</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <span class="logo">🐔 Pollos App</span>
        <a href="index.html">Dashboard</a>
        <a href="ventas.html">Ventas</a>
        <a href="clientes.html">Clientes</a>
        <a href="fiados.html">Fiados</a>
    </nav>

    <div class="contenedor">
        <h2>Registrar venta</h2>

        <div id="modal-editar-overlay" class="modal-overlay" style="display:none;">
    <div class="modal-confirmar" style="max-width:400px; text-align:left;">
        <h3>Editar venta</h3>
        <form id="form-editar-venta">
            <label>Cliente</label>
            <select id="edit-cliente" required></select>

            <label>Peso (lb)</label>
            <input type="number" id="edit-peso" step="0.01" min="0.1" required>

            <label>Precio por libra</label>
            <input type="number" id="edit-precio" step="0.01" min="0.1" required>

            <div class="modal-botones" style="margin-top:16px;">
                <button type="button" class="btn-cancelar" onclick="cerrarModalEditar()">Cancelar</button>
                <button type="submit" class="btn-confirmar" style="background:#2563eb;">Guardar cambios</button>
            </div>
        </form>
    </div>
</div>

        <form id="form-venta">
            <label>Cliente</label>
            <select id="select-cliente" required></select>

            <div style="margin:12px 0;">
                <label><input type="radio" name="modo-venta" value="libra" checked> Por libra</label>
                <label style="margin-left:16px;"><input type="radio" name="modo-venta" value="directo"> Precio directo</label>
            </div>

            <div id="campos-libra">
                <label>Peso (lb)</label>
                <input type="number" id="input-peso" step="0.01" min="0.1">

                <label>Precio por libra</label>
                <input type="number" id="input-precio" step="0.01" min="0.1">
            </div>

            <div id="campos-directo" style="display:none;">
                <label>Precio total ($)</label>
                <input type="number" id="input-precio-total" step="0.01" min="0.1" placeholder="Ej: 60000">
            </div>

            <label>
                <input type="checkbox" id="input-fiado">
                Venta fiada (paga en quincena)
            </label>

            <div id="total-preview" style="font-size:20px; font-weight:bold;"></div>

            <button type="submit" class="btn">Registrar venta</button>
        </form>

        <h3 style="margin-top:30px;">Ventas recientes</h3>
        <table>
            <thead>
            <tr><th>Fecha</th><th>Cliente</th><th>Peso</th><th>Precio/lb</th><th>Total</th><th>Tipo</th><th>Acción</th></tr>
            </thead>
            <tbody id="tabla-ventas"></tbody>
        </table>
    </div>

    <script src="js/services/apiClient.js"></script>
    <script src="js/services/clienteService.js"></script>
    <script src="js/services/ventaService.js"></script>
    <script src="js/pages/ventasPage.js"></script>
    <script src="js/utils/toast.js"></script>
</body>
</html>
