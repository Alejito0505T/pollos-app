<!DOCTYPE html>
<html lang="es">
<head>
    <script src="js/utils/authGuard.js"></script>
    <meta charset="UTF-8">
    <title>Pollos - Clientes</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
        <nav class="navbar">
        <button class="btn-hamburguesa" onclick="alternarSidebar()"><i class="fa-solid fa-bars"></i></button>
        <span class="logo">🐔 Pollos App</span>
    </nav>

    <div class="overlay-sidebar" id="overlay-sidebar" onclick="cerrarSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <a href="index.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
        <a href="ventas.html"><i class="fa-solid fa-cart-shopping"></i> Ventas</a>
        <a href="clientes.html"><i class="fa-solid fa-users"></i> Clientes</a>
        <a href="fiados.html"><i class="fa-solid fa-hand-holding-dollar"></i> Fiados</a>
        <a href="quincena.html"><i class="fa-solid fa-calendar-week"></i> Quincena</a>
        <a href="mes.html"><i class="fa-solid fa-calendar-days"></i> Mes</a>

        <div class="sidebar-usuario">
        <i class="fa-solid fa-circle-user"></i>
        <div class="sidebar-usuario-info">
            <span id="sidebar-usuario-nombre">Cargando...</span>
            <a href="#" id="sidebar-cerrar-sesion">Cerrar sesión</a>
        </div>
    </div>
</aside>

    <div class="contenedor" style="max-width:1200px;">
        <h2><i class="fa-solid fa-calendar-week"></i> Resumen quincenal</h2>

        <div style="display:flex; gap:16px; align-items:center; margin-bottom:20px; flex-wrap:wrap;">
            <div>
                <label><i class="fa-solid fa-calendar"></i> Mes</label>
                <input type="month" id="input-mes-quincena">
            </div>
            <div>
                <label><i class="fa-solid fa-list-ol"></i> Quincena</label>
                <select id="select-quincena">
                    <option value="1">1 - 15</option>
                    <option value="2">16 - fin de mes</option>
                </select>
            </div>
        </div>

        <div class="tarjetas" style="margin-bottom:24px;">
            <div class="tarjeta">
                <div class="tarjeta-icono"><i class="fa-solid fa-cart-shopping"></i></div>
                <div class="tarjeta-texto">
                    <div style="font-size:28px; font-weight:bold;" id="q-total-ventas">0</div>
                    <div>Ventas registradas</div>
                    <div class="tarjeta-descripcion">En esta quincena</div>
                </div>
            </div>
            <div class="tarjeta">
                <div class="tarjeta-icono"><i class="fa-solid fa-sack-dollar"></i></div>
                <div class="tarjeta-texto">
                    <div style="font-size:28px; font-weight:bold;" id="q-total-dinero">$0</div>
                    <div>Total vendido</div>
                    <div class="tarjeta-descripcion">Suma de todas las ventas</div>
                </div>
            </div>
            <div class="tarjeta">
                <div class="tarjeta-icono"><i class="fa-solid fa-hand-holding-dollar"></i></div>
                <div class="tarjeta-texto">
                    <div style="font-size:28px; font-weight:bold;" id="q-total-fiado">$0</div>
                    <div>Fiado en la quincena</div>
                    <div class="tarjeta-descripcion">Pendiente por cobrar</div>
                </div>
            </div>
        </div>

        <div class="tabla-scroll" style="max-height:500px;">
            <table>
                <thead>
                    <tr>
                        <th><i class="fa-solid fa-calendar-days"></i> Fecha</th>
                        <th><i class="fa-solid fa-user"></i> Cliente</th>
                        <th><i class="fa-solid fa-weight-hanging"></i> Peso</th>
                        <th><i class="fa-solid fa-tag"></i> Precio/lb</th>
                        <th><i class="fa-solid fa-dollar-sign"></i> Total</th>
                        <th><i class="fa-solid fa-circle-info"></i> Tipo</th>
                    </tr>
                </thead>
                <tbody id="tabla-quincena"></tbody>
            </table>
        </div>
    </div>

    <script src="js/utils/sidebar.js"></script>
    <script src="js/utils/toast.js"></script>
    <script src="js/services/apiClient.js"></script>
    <script src="js/services/ventaService.js"></script>
    <script src="js/pages/quincenaPage.js"></script>
</body>
</html>
