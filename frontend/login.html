<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pollos - Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="contenedor" style="max-width:400px; margin-top:80px;">
        <h2>Iniciar sesión</h2>
        <form id="form-login">
            <label>Email</label>
            <input type="email" id="input-email" required>
            <label>Contraseña</label>
            <input type="password" id="input-password" required>
            <button type="submit" class="btn">Entrar</button>
        </form>
    </div>

    <script src="js/services/apiClient.js"></script>
    <script src="js/pages/loginPage.js"></script>
    <script src="js/utils/toast.js"></script>
</body>
</html>
