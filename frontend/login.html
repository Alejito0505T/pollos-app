<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        if (localStorage.getItem('token')) {
            window.location.href = 'index.html';
        }
    </script>
    <meta charset="UTF-8">
    <title>Pollos - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d0d0d;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        .tarjeta-login {
            width: 100%;
            max-width: 400px;
            background: #1a1a1a;
            border: 1px solid #2d2d2d;
            border-radius: 20px;
            padding: 40px 32px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .tarjeta-login h2 {
            color: #f5f5f5;
            text-align: center;
            margin: 0 0 24px 0;
            font-size: 22px;
        }
        .tarjeta-login h2 .pollo { margin-right: 6px; }
        #google-btn {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .divisor {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #6b6b6b;
            font-size: 13px;
            margin: 20px 0;
        }
        .divisor::before, .divisor::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #2d2d2d;
        }
        .tarjeta-login label {
            display: block;
            color: #b4b4b4;
            font-size: 13px;
            margin-bottom: 6px;
        }
        .tarjeta-login input {
            width: 100%;
            background: #262626;
            border: 1px solid #3a3a3a;
            color: #f5f5f5;
            padding: 13px 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 16px;
            outline: none;
        }
        .tarjeta-login input:focus {
            border-color: #6b6b6b;
        }
        .btn-entrar {
            width: 100%;
            background: #f5f5f5;
            color: #0d0d0d;
            border: none;
            padding: 13px;
            border-radius: 999px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-entrar:hover { background: #d9d9d9; }
    </style>
</head>
<body>
    <div class="tarjeta-login">
        <h2><span class="pollo">🐔</span>Iniciar sesión</h2>

        <div id="google-btn"></div>

        <div class="divisor">o</div>

        <form id="form-login">
            <label>Email</label>
            <input type="email" id="input-email" required>
            <label>Contraseña</label>
            <input type="password" id="input-password" required>
            <button type="submit" class="btn-entrar">Entrar</button>
        </form>
    </div>

    <script src="js/utils/toast.js"></script>
    <script src="js/services/apiClient.js"></script>
    <script src="js/pages/loginPage.js"></script>
</body>
</html>
